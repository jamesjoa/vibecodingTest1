<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>하루 — 할 일 관리</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="grain"></div>
    </div>

    <main class="app">
      <header class="hero">
        <p class="brand">하루</p>
        <h1 class="headline">오늘을 가볍게 정리하세요</h1>
        <p class="subcopy">해야 할 일을 적고, 끝내고, 비우세요.</p>
      </header>

      <section class="composer" aria-label="할 일 추가">
        <form id="todo-form" class="todo-form" autocomplete="off">
          <label class="sr-only" for="todo-input">새 할 일</label>
          <input
            id="todo-input"
            class="todo-input"
            type="text"
            placeholder="무엇을 할까요?"
            maxlength="120"
            required
          />
          <button type="submit" class="add-btn" aria-label="할 일 추가">
            <span class="add-btn-label">추가</span>
            <svg class="add-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 5v14M5 12h14"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </form>
      </section>

      <section class="board" aria-label="할 일 목록">
        <div class="toolbar">
          <div class="filters" role="tablist" aria-label="필터">
            <button
              type="button"
              class="filter-btn is-active"
              data-filter="all"
              role="tab"
              aria-selected="true"
            >
              전체
            </button>
            <button
              type="button"
              class="filter-btn"
              data-filter="active"
              role="tab"
              aria-selected="false"
            >
              진행 중
            </button>
            <button
              type="button"
              class="filter-btn"
              data-filter="completed"
              role="tab"
              aria-selected="false"
            >
              완료
            </button>
          </div>
          <p class="count" id="todo-count" aria-live="polite">0개 남음</p>
        </div>

        <ul id="todo-list" class="todo-list"></ul>

        <div id="empty-state" class="empty-state" hidden>
          <p class="empty-title">아직 할 일이 없어요</p>
          <p class="empty-text">위에 첫 번째 할 일을 적어보세요.</p>
        </div>

        <div class="footer-actions">
          <button type="button" id="clear-completed" class="clear-btn" hidden>
            완료된 항목 지우기
          </button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
